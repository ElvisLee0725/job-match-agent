[project]
name = "job-match-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.setuptools.packages.find]
include = ["app*"]
